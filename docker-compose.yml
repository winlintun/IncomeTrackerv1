services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or environment}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PORT: ${PORT:-3000}
      APP_ENV: ${APP_ENV:-}
