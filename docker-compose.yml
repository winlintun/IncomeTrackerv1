services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incometracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incometracker}
      POSTGRES_DB: ${POSTGRES_DB:-incometracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incometracker} -d ${POSTGRES_DB:-incometracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or environment}
      DATABASE_URL: postgresql://${POSTGRES_USER:-incometracker}:${POSTGRES_PASSWORD:-incometracker}@db:5432/${POSTGRES_DB:-incometracker}
      PORT: ${PORT:-3000}
      FLASK_ENV: ${FLASK_ENV:-}

volumes:
  postgres_data:
